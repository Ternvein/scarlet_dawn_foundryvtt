<section class="tab description flexcol {{tab.cssClass}}" data-group="primary" data-tab="description">
  <h4>{{localize fields.description.label}}</h4>
  {{#if editable}}
  {{formInput fields.description value=system.description toggled=true enriched=enrichedDescription}}
  {{else}}
  <div class="description">
    {{{enrichedDescription}}}
  </div>
  {{/if}}
</section>
